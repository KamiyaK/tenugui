# push と main 向けプルリクエストのたびにテストを実行する
name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# 同じプルリクエストに続けて push したときは、古い方の実行を止める（main への push は止めない）
concurrency:
  group: test-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    # 普段は1分かからない。Windows では止まる値の試験（SIGALRM の時間制限）が飛ばされるので、
    # 万一固まっても6時間走り続けないように上限を置く
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - run: python -m pytest -q
      - run: python -m tenugui --version
        env:
          PYTHONPATH: src
