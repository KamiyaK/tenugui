# main に入った版（pyproject.toml の version）のタグとリリースを、まだ無ければ自動で作る。
# 版を上げて main にマージするだけで v0.8.0 のようなタグが付く。
# main への push で走った test がすべて通ったときだけ作る（テストの落ちる版にタグを付けない）。
name: release

on:
  workflow_run:
    workflows: [test]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}   # テストした版そのもの（その後に入った版ではなく）
      - name: 版を読む
        id: v
        run: |
          VER=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
      - name: タグとリリースを作る（まだ無いときだけ）
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.v.outputs.version }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          TAG="v$VER"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG は既にあります"
            exit 0
          fi
          awk -v v="$VER" 'index($0, "## [" v "]") == 1 {on = 1; next} /^## \[/ {on = 0} /^\[[0-9]/ {on = 0} on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md に ## [$VER] の節がありません" >&2
            exit 1
          fi
          gh release create "$TAG" --target "$SHA" --title "Tenugui $VER" --notes-file notes.md
